name: Build and Publish Image (GHCR)

# 在推送到 main 分支、打 v* 标签、或手动触发时，构建镜像并推送到 GitHub Container Registry (GHCR)。
# 镜像地址：ghcr.io/xxin12/win888  （owner 自动转小写）
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送 GHCR 镜像所需

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（多架构：x86_64 / ARM，覆盖威联通不同 CPU）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算小写镜像名（GHCR 要求 owner 小写）
        run: echo "IMAGE=${REGISTRY}/$(echo ${GITHUB_REPOSITORY} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch          # main 分支 -> main
            type=semver,pattern={{version}} # v1.2.3 -> 1.2.3
            type=semver,pattern={{major}}.{{minor}} # v1.2.3 -> 1.2
            type=raw,value=latest,enable={{is_default_branch}} # main -> latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
