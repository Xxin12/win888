<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>简易量化系统</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#1f2329;--sub:#6b7280;--line:#e5e7eb;
  --up:#e23c3c;--down:#1aa260;--accent:#2f6fed;--accent2:#0ea5a5;--warn:#d98a00;
  --shadow:0 1px 3px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--accent);text-decoration:none}
.app{display:flex;min-height:100%}
.side{width:180px;background:#0f172a;color:#cbd5e1;flex:0 0 180px;padding:16px 0}
.side .logo{font-size:16px;font-weight:700;color:#fff;padding:6px 20px 16px;letter-spacing:.5px}
.side .logo small{display:block;color:#64748b;font-size:11px;font-weight:400;margin-top:2px}
.side .nav a{display:block;padding:11px 20px;color:#cbd5e1;font-size:14px;border-left:3px solid transparent}
.side .nav a:hover{background:#1e293b}
.side .nav a.active{background:#1e293b;border-left-color:var(--accent);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;box-shadow:var(--shadow)}
.topbar .status{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.live{background:var(--down);box-shadow:0 0 0 3px rgba(26,162,96,.15)}
.dot.stale{background:var(--warn)}
.content{padding:18px;flex:1;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:0}
/* 实时看盘双栏布局(可响应式堆叠, 不机械左右分隔) */
.watch-row{display:flex;gap:16px;align-items:flex-start}
.col-left{min-width:0;flex:66 1 0;margin-bottom:0}
.col-right{min-width:0;flex:34 1 0;display:flex;flex-direction:column;gap:12px;margin-bottom:0}
.col-right .panel{margin-bottom:0} /* 列内已由 gap 控制间距, 去掉 .panel 默认 margin 避免双倍间隙(修复三面板间隔过大) */
@media (max-width:960px){
  .watch-row{flex-direction:column}
  .col-left,.col-right{flex:1 1 auto;width:100%}
}
.up{color:var(--up)!important}.down{color:var(--down)!important}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;background:#fafbfc}
tr:hover td{background:#f8fafc}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{opacity:.9;color:#fff}
input,select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13px;background:#fff}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;color:#fff;font-weight:600}
.chart{width:100%}
.metric{background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:10px;padding:12px 14px;flex:1;min-width:120px}
.metric .k{font-size:12px;color:var(--sub)}
.metric .v{font-size:22px;font-weight:700;margin-top:3px}
.muted{color:var(--sub);font-size:12px}
.pill{font-size:11px;border:1px dashed var(--line);border-radius:8px;padding:1px 7px;color:var(--sub)}
.decision{border-radius:10px;padding:14px 16px;color:#fff}
.decision.up-panel{background:linear-gradient(135deg,#e23c3c,#c0392b)}
.decision.down-panel{background:linear-gradient(135deg,#1aa260,#0e8a4f)}
.decision.flat-panel{background:linear-gradient(135deg,#64748b,#475569)}
.bigprice{font-size:32px;font-weight:800;line-height:1}
.zone{display:flex;gap:10px;margin-top:10px}
.zone .z{flex:1;background:rgba(255,255,255,.15);border-radius:8px;padding:8px 10px}
.zone .z .zk{font-size:11px;opacity:.85}.zone .z .zv{font-size:16px;font-weight:700}
.loading{color:var(--sub);padding:20px;text-align:center}
/* ===== 重启系统按钮 + 重启遮罩 ===== */
.btn-restart{margin-left:12px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-restart:hover{border-color:var(--accent);color:var(--accent)}
.btn-restart:disabled{opacity:.6;cursor:default}
.overlay-restart{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100}
.restart-box{background:#fff;border-radius:14px;padding:26px 34px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:340px}
.spinner{width:34px;height:34px;border:4px solid #e5e7eb;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rb-title{font-size:16px;font-weight:700;margin-bottom:6px}
/* ===== 表单(企微通知配置页) ===== */
.form{display:flex;flex-direction:column;gap:12px;max-width:560px}
.form .row2{display:flex;align-items:center;gap:12px}
.form .row2.col{flex-direction:column;align-items:flex-start;gap:5px}
.form .row2 > span{min-width:150px;font-weight:600;flex:0 0 auto}
.form .row2.col > span{min-width:auto}
.form .row2 input[type=checkbox]{width:18px;height:18px}
.form .row2 input[type=text],.form .row2 input:not([type]){flex:1}
.form .sep{border-top:1px dashed var(--line);margin:4px 0}
.form code{background:#eef1f5;padding:1px 6px;border-radius:5px;font-size:12px}
.form ol{padding-left:20px}
/* ===== 移动端适配 (≤768px) ===== */
@media (max-width: 768px) {
  /* 框架: 侧栏变顶部横向吸顶导航, 主体整页滚动 */
  .app { flex-direction: column; }
  .side {
    width: 100%; flex: none; flex-direction: row; align-items: center;
    padding: 6px 10px; position: sticky; top: 0; z-index: 30;
    overflow-x: auto; overflow-y: hidden; box-shadow: var(--shadow);
  }
  .side .logo { font-size: 14px; padding: 0 10px 0 0; white-space: nowrap; flex: none; }
  .side .logo small { display: none; }
  .side .nav { display: flex; flex-direction: row; gap: 2px; }
  .side .nav a {
    border-left: none; border-bottom: 2px solid transparent;
    padding: 9px 12px; font-size: 13px; white-space: nowrap;
  }
  .side .nav a.active { border-left-color: transparent; border-bottom-color: var(--accent); }
  .main { min-width: 0; }
  .topbar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .topbar .status { margin-left: auto; }
  /* 内容整页滚动, 不再内部滚动 */
  .content { overflow: visible; padding: 10px 10px 24px; }
  /* 多列布局堆叠为单列, 并强制解除各页面内联 minWidth */
  .row { flex-direction: column; gap: 12px; }
  .col { min-width: 0 !important; width: 100% !important; }
  /* 面板内表格横向滚动 */
  .panel { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* 表单行在窄屏堆叠, 避免 150px 标签挤压输入框 */
  .form .row2 { flex-direction: column; align-items: flex-start; gap: 5px; }
  .form .row2 > span { min-width: auto; }
  .form .row2 input:not([type]), .form .row2 select { width: 100%; max-width: 100%; }
  /* 做T决策面板内部堆叠 */
  .decision-top { flex-direction: column !important; align-items: flex-start !important; gap: 8px; }
  .decision-top > div:last-child { text-align: left !important; max-width: 100%; }
  .bigprice { font-size: 26px; }
  .metric { min-width: 0; flex: 1 1 42%; }
  table { font-size: 12px; }
  th, td { padding: 6px 8px; }
  input, select { max-width: 100%; }
}
</style>
</head>
<body>
<div id="root"><div class="loading">加载中…</div></div>
<script src="./app.js"></script>
</body>
</html>
